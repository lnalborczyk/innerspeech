project:
  type: website
  output-dir: _site

website:
  title: "INNERSPEECH"
  description: "Comprendre la diversité de la parole intérieure et ses mécanismes cérébraux. Projet financé par l'ANR."
  site-url: "https://lnalborczyk.github.io/innerspeech/"
  favicon: assets/favicon.svg
  image: assets/social-card.svg
  navbar:
    title: "INNERSPEECH"
    # logo: assets/favicon.svg
    left:
      - text: "Le projet"
        href: index.qmd
      - text: "La recherche"
        href: recherche.qmd
      - text: "Participer"
        href: participer.qmd
      - text: "Recrutements"
        href: recrutements.qmd
      - text: "L'équipe"
        href: equipe.qmd
    right:
      - text: "Contact"
        href: contact.qmd
  page-footer:
    # left: "© INNERSPEECH · Projet ANR JCJC 2026 · Laboratoire Parole et Langage (CNRS / Aix-Marseille Université)"
    # website:
    # page-footer:
    left: |
      <img src="assets/anr.jpeg"
           alt="Agence nationale de la recherche"
           style="height: 48px;">
      <p>Projet financé par l'Agence nationale
      de la recherche (ANR).</p>
  search: true

lang: fr
format:
  html:
    theme: cosmo
    css: styles/site.css
